name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Static checks
        run: npm run check
      - name: Regression tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test
      - name: Confirm build metadata
        run: |
          test -f version.json
          node -e "const v=require('./version.json'); if(!v.version||!v.commit||v.commit==='unknown') process.exit(1); console.log(v)"
